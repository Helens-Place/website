[build]
  # tina:build runs `tinacms build` first, which generates public/admin,
  # then `astro build`. Requires TINA_CLIENT_ID and TINA_TOKEN to be set in the
  # Netlify dashboard.
  command = "npm run tina:build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Astro emits a 404.html which Netlify serves automatically for unmatched
# routes, so no catch-all redirect is needed here.

# ---------------------------------------------------------------------------
# Redirects from the old WordPress site.
#
# These paths were taken from the live site's own navigation, not guessed, so
# existing links, bookmarks and search results keep working. Netlify matches
# rules in order, so the specific paths come before the section wildcards.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/helen/"
  to = "/about"
  status = 301

[[redirects]]
  from = "/support/dyslexia-support/"
  to = "/assessments"
  status = 301

[[redirects]]
  from = "/support/the-elevator-series/"
  to = "/elevator-series"
  status = 301

[[redirects]]
  from = "/working-together/research/"
  to = "/research-and-expert-witness"
  status = 301

[[redirects]]
  from = "/working-together/speaker-and-corporate/"
  to = "/speaking"
  status = 301

[[redirects]]
  from = "/literacy-learning-journeys/"
  to = "/book"
  status = 301

[[redirects]]
  from = "/books-publications-and-blog/"
  to = "/book"
  status = 301

[[redirects]]
  from = "/publications-and-media/"
  to = "/publications"
  status = 301

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/safeguarding-policy/"
  to = "/safeguarding"
  status = 301

[[redirects]]
  from = "/ts-and-cs/"
  to = "/terms"
  status = 301

# WordPress feed. Anyone subscribed lands on the blog instead of an error.
[[redirects]]
  from = "/feed/"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/comments/feed/"
  to = "/blog"
  status = 301

# Section wildcards, last, to catch any child page not listed above.
[[redirects]]
  from = "/support/*"
  to = "/assessments"
  status = 301

[[redirects]]
  from = "/working-together/*"
  to = "/schools"
  status = 301

# ---------------------------------------------------------------------------

# ===========================================================================
# REMOVE THIS BLOCK BEFORE POINTING helensplace.co.uk AT NETLIFY.
#
# While the site lives on its temporary netlify.app address it is publicly
# reachable, and Google will index it if allowed to. That would put a review
# copy of the site, including the draft terms page, into search results, and
# leave a duplicate competing with the real domain later.
#
# This header tells search engines to leave the whole site alone. It must come
# off at go-live or the real site will never be indexed either.
# ===========================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
